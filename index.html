<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6c63d" />
    <title>光电研学</title>
    <link rel="stylesheet" href="./shared/app.css" />
  </head>
  <body class="portal-page">
    <main class="portal">
      <section class="portal-hero">
        <div class="brand-lockup">
          <div class="brand-mark">光</div>
          <div>
            <strong>光电研学</strong>
            <span>让每一次探索都有光</span>
          </div>
        </div>
        <span class="status-pill">Windows / Mobile / PWA</span>
        <h1>选择你的工作空间</h1>
        <p>家长和学生进入研学服务端，学校老师和管理员进入学校管理端。</p>
        <div class="portal-actions">
          <a class="portal-choice choice-parent" href="./frontend/">
            <span class="choice-icon">◎</span>
            <span>
              <strong>家长 / 学生端</strong>
              <small>浏览课程、报名、日程、反馈和证书</small>
            </span>
            <b>进入 →</b>
          </a>
          <a class="portal-choice choice-school" href="./backend/">
            <span class="choice-icon">▦</span>
            <span>
              <strong>学校管理端</strong>
              <small>发布课程、审核报名、管理签到和资源</small>
            </span>
            <b>进入 →</b>
          </a>
        </div>
      </section>
      <aside class="portal-visual" aria-hidden="true">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <div class="sun"></div>
        <div class="signal signal-one"></div>
        <div class="signal signal-two"></div>
        <div class="signal signal-three"></div>
      </aside>
    </main>
  </body>
</html>
